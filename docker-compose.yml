version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - .env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - app_data:/app/uploads
    links:
      - db
      - minio
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ghibli
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=ghibliadmin
      - MINIO_ROOT_PASSWORD=ghibliadmin123
      - MINIO_PORT=9000
      - MINIO_CONSOLE_PORT=9001
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

volumes:
  postgres_data:
  minio_data:
  app_data:

networks:
  app-network:
    driver: bridge