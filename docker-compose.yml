version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - .env
    depends_on:
      - db
      - minio

  db:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ghibli
    volumes:
      - postgres_data:/var/lib/postgresql/data

    minio:
        image: minio/minio
        container_name: minio
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
        command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
        ports:
            - "${MINIO_PORT}:9000" # API
            - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}" # Console
        volumes:
            - minio-data:/data
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "-f",
                    "http://localhost:${MINIO_PORT}/minio/health/live",
                ]
            interval: 30s
            timeout: 20s
            retries: 3

volumes:
  postgres_data:
  minio_data: 
  app_data: